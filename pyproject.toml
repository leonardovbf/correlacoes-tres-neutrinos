[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "correlacoes-tres-neutrinos"
version = "0.1.0"
description = "Plataforma local de simulação de oscilações coletivas de neutrinos"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
qiskit = ["qiskit>=2.5,<3", "qiskit-aer>=0.17,<1", "qiskit-ibm-runtime>=0.50,<0.52"]
legacy = ["matplotlib>=3.8,<4", "streamlit>=1.58,<2"]
test = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]
